# Fonte da verdade do progresso gamificado do AI-Lab.
#
# Regras:
# - XP vem apenas de atividades concluídas (`done = true`), pesadas por tipo.
# - Uma aula só é concluída quando sua atividade `boss` (arguição sem consulta) é vencida.
# - Uma aula só é desbloqueada quando todas as aulas em `requires` estão concluídas.
# - Badges são concedidos pelo tutor, registrando a data em `earned`.
#
# Após editar: `uv run ai-lab progress --write` para regenerar o painel em PROGRESS.md.

[xp]
exercise = 10    # exercício da aula executado e registrado
experiment = 20  # experimento com evidência (gráfico, tabela, análise)
boss = 50        # boss fight: explicar o critério da aula sem consultar material
milestone = 100  # marco de projeto entregue

# Níveis por XP acumulado. `min_xp` precisa estar em ordem crescente.
[[levels]]
min_xp = 0
title = "Aprendiz de Gradiente"

[[levels]]
min_xp = 300
title = "Domador de Vetores"

[[levels]]
min_xp = 800
title = "Artesão de Modelos"

[[levels]]

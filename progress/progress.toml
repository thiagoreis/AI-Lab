title = "Engenheiro de Redes Neurais"

[[levels]]
min_xp = 2800
title = "Mestre da Atenção"

[[levels]]
min_xp = 4500
title = "Arquiteto de Agentes"

[[levels]]
min_xp = 7000
title = "AI Architect"

